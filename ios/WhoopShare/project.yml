name: WhoopShare
options:
  bundleIdPrefix: com.kanishkkundu
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
targets:
  WhoopShare:
    type: application
    platform: iOS
    sources:
      - path: Sources/WhoopShareApp
      - path: Sources/Shared
    dependencies:
      - target: WhoopShareMessagesExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kanishkkundu.whoopshare
        INFOPLIST_FILE: Sources/WhoopShareApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/WhoopShareApp/WhoopShare.entitlements
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1"
        GENERATE_INFOPLIST_FILE: false
  WhoopShareMessagesExtension:
    type: app-extension
    platform: iOS
    productType: com.apple.product-type.app-extension.messages
    sources:
      - path: Sources/MessagesExtension
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kanishkkundu.whoopshare.MessagesExtension
        INFOPLIST_FILE: Sources/MessagesExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/MessagesExtension/WhoopShareMessagesExtension.entitlements
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1"
        GENERATE_INFOPLIST_FILE: false
        APPLICATION_EXTENSION_API_ONLY: true
